<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>2048 — 6×6</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <h1>2048</h1>
        <span class="badge">6×6</span>
      </div>
      <div class="scores">
        <div class="score-box">
          <span class="score-label">Счёт</span>
          <span id="score">0</span>
          <span id="score-add" class="score-add" hidden></span>
        </div>
        <div class="score-box">
          <span class="score-label">Рекорд</span>
          <span id="best">0</span>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <p class="hint">Сложите одинаковые плитки. Победите, набрав <strong>2048</strong>.</p>
      <div class="actions">
        <button type="button" id="undo" class="btn btn-ghost" disabled>Отмена</button>
        <button type="button" id="restart" class="btn">Новая игра</button>
      </div>
    </div>

    <section class="board-wrap" id="board-wrap">
      <div class="grid" id="grid"></div>
      <div class="tiles" id="tiles"></div>
      <div class="overlay" id="overlay" hidden>
        <div class="overlay-card">
          <p id="overlay-title">Игра окончена</p>
          <div class="overlay-actions">
            <button type="button" id="keep-playing" class="btn btn-ghost" hidden>Продолжить</button>
            <button type="button" id="overlay-restart" class="btn">Заново</button>
          </div>
        </div>
      </div>
    </section>

    <p class="controls-hint">Стрелки или WASD на клавиатуре, свайп на телефоне.</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
